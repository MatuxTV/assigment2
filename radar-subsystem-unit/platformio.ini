[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    arduino-libraries/Servo
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; tests are standalone host programs (see header of each file), not PIO unit tests
test_ignore = *
